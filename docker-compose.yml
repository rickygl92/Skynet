services:

  mysql:
    image: mysql:8.0
    container_name: skynet_mysql
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3306"
    volumes:
      - skynet_mysql_data:/var/lib/mysql
    networks:
      - skynet_private

  wordpress:
    image: wordpress:6.4-apache
    container_name: skynet_wordpress
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    volumes:
      - skynet_wordpress_data:/var/www/html
    networks:
      - skynet_public
      - skynet_private
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: skynet_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/certs/servidor.crt:/etc/nginx/certs/servidor.crt:ro
      - /etc/ssl/private/servidor.key:/etc/nginx/certs/servidor.key:ro
    networks:
      - skynet_public
    depends_on:
      - wordpress

volumes:

  skynet_mysql_data:
    name: skynet_mysql_data

  skynet_wordpress_data:
    name: skynet_wordpress_data

networks:

  skynet_public:
    name: skynet_public
    driver: bridge

  skynet_private:
    name: skynet_private
    driver: bridge
    internal: true
